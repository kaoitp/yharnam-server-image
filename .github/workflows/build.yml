name: Build upstream server
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published upstream release tag (blank selects most recently published, including prereleases)'
        type: string
        required: false
permissions:
  contents: read
  packages: write
concurrency:
  group: server-image
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      image: ${{ steps.release.outputs.image }}
    timeout-minutes: 120
    steps:
      - name: Select published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_TAG" ]]; then
            [[ "$REQUESTED_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]] || { echo 'Unsupported image tag' >&2; exit 1; }
            release=$(gh api "repos/Amanises-Yharnam-Together/BBSC-Yharnam-Together/releases/tags/$REQUESTED_TAG")
            tag=$(jq -er 'select(.draft == false and .published_at != null) | .tag_name' <<< "$release")
          else
            tag=$(gh api --paginate --slurp 'repos/Amanises-Yharnam-Together/BBSC-Yharnam-Together/releases?per_page=100' | jq -er '[.[][] | select(.draft == false and .published_at != null)] | sort_by(.published_at) | last | .tag_name')
          fi
          [[ "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]] || { echo 'No published release or unsupported image tag' >&2; exit 1; }
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo 'Release tag is not a supported client version' >&2; exit 1; }
          [[ "$tag" != latest ]] || { echo 'Upstream tag latest is reserved' >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER,,}/yharnam-server" >> "$GITHUB_OUTPUT"
      - name: Check whether tag already exists in GHCR
        id: existing
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ steps.release.outputs.tag }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner=${OWNER,,}
          token=$(curl -fsS -u "$ACTOR:$GH_TOKEN" "https://ghcr.io/token?service=ghcr.io&scope=repository:$owner/yharnam-server:pull,push" | jq -er .token)
          echo "::add-mask::$token"
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' "https://ghcr.io/v2/$owner/yharnam-server/manifests/$TAG")
          case "$status" in
            200) echo 'exists=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'exists=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "Registry lookup failed: HTTP $status" >&2; exit 1 ;;
          esac
      - name: Checkout upstream release
        if: steps.existing.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: Amanises-Yharnam-Together/BBSC-Yharnam-Together
          ref: refs/tags/${{ steps.release.outputs.tag }}
          persist-credentials: false
      - name: Record source and initialize protobuf
        if: steps.existing.outputs.exists != 'true'
        id: source
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git submodule update --init server/externals/protobuf
          test -f server/externals/protobuf/CMakeLists.txt
      - uses: docker/setup-buildx-action@v3
        if: steps.existing.outputs.exists != 'true'
      - name: Build image locally
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/hosting/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
          cache-from: type=gha,scope=shadnet
          cache-to: type=gha,mode=max,scope=shadnet
      - name: Smoke test before publishing
        if: steps.existing.outputs.exists != 'true'
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          docker run -d --name smoke "$IMAGE:$TAG"
          trap 'docker logs smoke; docker rm -fv smoke' EXIT
          ready=false
          for i in $(seq 1 30); do
            if [[ "$(docker inspect -f '{{.State.Running}}' smoke)" != true ]]; then break; fi
            if docker exec smoke shadnet --admin stats >/dev/null 2>&1; then ready=true; break; fi
            sleep 2
          done
          [[ "$ready" == true ]]
          docker exec smoke test -s /data/link_key.bin
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: steps.existing.outputs.exists != 'true'
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          TAG: ${{ steps.release.outputs.tag }}
        run: docker push "$IMAGE:$TAG"


      - name: Checkout image configuration
        uses: actions/checkout@v4
        with:
          path: publisher
      - name: Attach and verify release version
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          TAG: ${{ steps.release.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fixed="$TAG-r2"
          token=$(curl -fsS -u "$ACTOR:$GH_TOKEN" "https://ghcr.io/token?service=ghcr.io&scope=repository:${OWNER,,}/yharnam-server:pull,push" | jq -er .token)
          echo "::add-mask::$token"
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' "https://ghcr.io/v2/${OWNER,,}/yharnam-server/manifests/$fixed")
          case "$status" in
            200) docker pull "$IMAGE:$fixed" ;;
            404) docker build --build-arg BASE_IMAGE="$IMAGE:$TAG" --build-arg RELEASE_VERSION="${TAG#v}" -f publisher/Dockerfile.release -t "$IMAGE:$fixed" publisher ;;
            *) echo "Registry lookup failed: HTTP $status" >&2; exit 1 ;;
          esac
          docker run -d --name release-smoke "$IMAGE:$fixed"
          trap 'docker logs release-smoke; docker rm -fv release-smoke' EXIT
          ready=false
          for i in $(seq 1 30); do
            if docker exec release-smoke shadnet --admin stats >/dev/null 2>&1; then ready=true; break; fi
            sleep 2
          done
          [[ "$ready" == true ]]
          docker logs release-smoke 2>&1 | grep -F "bb-build 1;version=${TAG#v};"
          if [[ "$status" = 404 ]]; then docker push "$IMAGE:$fixed"; fi
      - name: Update latest for the newest published release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.release.outputs.image }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          newest=$(gh api --paginate --slurp 'repos/Amanises-Yharnam-Together/BBSC-Yharnam-Together/releases?per_page=100' | jq -er '[.[][] | select(.draft == false and .published_at != null)] | sort_by(.published_at) | last | .tag_name')
          if [[ "$TAG" != "$newest" ]]; then
            echo "Leaving latest unchanged: $TAG is not the newest published release ($newest)."
            exit 0
          fi
          docker pull "$IMAGE:$TAG-r2"
          docker tag "$IMAGE:$TAG-r2" "$IMAGE:latest"
          docker push "$IMAGE:latest"

  tailscale-image:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and test Tailscale-compatible image
        env:
          BASE: ${{ needs.image.outputs.image }}
          TAG: ${{ needs.image.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/yharnam-server-tailscale"
          base_tag=$TAG
          TAG="${TAG}-ts3"
          token=$(curl -fsS -u "$ACTOR:$GH_TOKEN" "https://ghcr.io/token?service=ghcr.io&scope=repository:${OWNER,,}/yharnam-server-tailscale:pull,push" | jq -er .token)
          echo "::add-mask::$token"
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' "https://ghcr.io/v2/${OWNER,,}/yharnam-server-tailscale/manifests/$TAG")
          case "$status" in
            200) docker pull "$image:$TAG" ;;
            404)
              docker build --build-arg BASE_IMAGE="$BASE:$base_tag-r2" --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -f Dockerfile.tailscale -t "$image:$TAG" .
              docker run -d --name ts-smoke --network bridge "$image:$TAG"
              trap 'docker logs ts-smoke; docker rm -fv ts-smoke' EXIT
              ready=false
              for i in $(seq 1 30); do
                if docker exec -u 10001:10001 ts-smoke shadnet --admin stats >/dev/null 2>&1; then ready=true; break; fi
                sleep 2
              done
              [[ "$ready" == true ]]
              docker logs ts-smoke 2>&1 | grep -F "bb-build 1;version=${base_tag#v};"
              docker exec ts-smoke sh -c 'test "$(id -u)" = 0 && test -s /data/link_key.bin && command -v apt-get && command -v gosu'
              docker top ts-smoke -eo pid,uid,comm | awk '$2 == "10001" && $3 == "shadnet" { found=1 } END { exit !found }'
              ;;
            *) echo "Registry lookup failed: HTTP $status" >&2; exit 1 ;;
          esac
          bash tests/test-unraid-hook.sh "$image:$TAG"
          if [[ "$status" = 404 ]]; then docker push "$image:$TAG"; fi
          newest=$(gh api --paginate --slurp 'repos/Amanises-Yharnam-Together/BBSC-Yharnam-Together/releases?per_page=100' | jq -er '[.[][] | select(.draft == false and .published_at != null)] | sort_by(.published_at) | last | .tag_name')
          if [[ "$base_tag" = "$newest" ]]; then
            docker tag "$image:$TAG" "$image:latest"
            docker push "$image:latest"
          fi